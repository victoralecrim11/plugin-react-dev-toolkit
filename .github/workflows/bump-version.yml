name: Bump da versao do plugin

# Push com versao explicitamente alterada preserva a versao humana.
# Push sem alteracao de versao continua recebendo auto-patch.
# Tags de release sao imutaveis: nunca use force tag/push.

on:
  push:
    branches: [main]
    paths:
      - ".agents/**"
      - ".claude-plugin/**"
      - ".codex-plugin/**"
      - "agents/**"
      - "commands/**"
      - "skills/**"
      - ".mcp.json"
  workflow_dispatch:
    inputs:
      part:
        description: "Versao atual ou parte a incrementar"
        type: choice
        default: patch
        options: [current, patch, minor, major]

permissions:
  contents: write

concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Selecionar a versao da release
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PART: ${{ inputs.part || 'patch' }}
        run: |
          CURRENT_VERSION=$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json", encoding="utf-8"))["version"])')

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$PART" == "current" ]]; then
            VERSION="$CURRENT_VERSION"
            echo "explicit_version_change=YES" >> "$GITHUB_OUTPUT"
            echo "auto_bump=NO" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            python3 scripts/bump-version.py --"$PART" | tee bump.log
            VERSION=$(python3 -c 'import re; print(re.search(r"::set-version::([^\\s]+)", open("bump.log", encoding="utf-8").read()).group(1))')
            rm bump.log
            echo "explicit_version_change=NO" >> "$GITHUB_OUTPUT"
            echo "auto_bump=YES" >> "$GITHUB_OUTPUT"
          else
            PREVIOUS_VERSION=$(BEFORE_SHA="$BEFORE_SHA" python3 - <<'PY'
          import json
          import os
          import subprocess

          before = os.environ.get("BEFORE_SHA", "")
          if not before or set(before) == {"0"}:
              print("")
          else:
              try:
                  raw = subprocess.check_output(
                      ["git", "show", f"{before}:.claude-plugin/plugin.json"],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  )
                  print(json.loads(raw)["version"])
              except (subprocess.CalledProcessError, KeyError, json.JSONDecodeError):
                  print("")
          PY
            )

            if [[ -z "$PREVIOUS_VERSION" || "$PREVIOUS_VERSION" != "$CURRENT_VERSION" ]]; then
              VERSION="$CURRENT_VERSION"
              echo "explicit_version_change=YES" >> "$GITHUB_OUTPUT"
              echo "auto_bump=NO" >> "$GITHUB_OUTPUT"
            else
              python3 scripts/bump-version.py --patch | tee bump.log
              VERSION=$(python3 -c 'import re; print(re.search(r"::set-version::([^\\s]+)", open("bump.log", encoding="utf-8").read()).group(1))')
              rm bump.log
              echo "explicit_version_change=NO" >> "$GITHUB_OUTPUT"
              echo "auto_bump=YES" >> "$GITHUB_OUTPUT"
            fi

            echo "previous_version=${PREVIOUS_VERSION:-NOT_FOUND}" >> "$GITHUB_OUTPUT"
          fi

          VERSION="$VERSION" python3 - <<'PY'
          import os
          import re
          version = os.environ["VERSION"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit(f"versao invalida: {version!r}")
          PY

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checagens proprias do pacote
        run: python3 scripts/validate-plugin.py

      - name: Instalar o Claude Code para a validacao oficial
        run: npm install -g @anthropic-ai/claude-code

      - name: Validacao oficial do manifesto
        run: claude plugin validate . --strict

      - name: Conferir que plugin.json e a entrada do marketplace concordam
        run: claude plugin tag . --dry-run --force

      - name: Commitar bump automatico, se necessario
        if: steps.version.outputs.auto_bump == 'YES'
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          if git diff --quiet; then
            echo "versao nao mudou, nada a commitar" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/ .codex-plugin/ .agents/ README.md manual.html
          git commit -m "chore(release): v$V

          Bump automatico da versao nos manifestos do Claude Code e do Codex.
          As duas plataformas usam o campo version para detectar atualizacao."
          git push

      - name: Criar tag imutavel
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$V"
          RELEASE_SHA=$(git rev-parse HEAD)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch --tags origin

          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            TAG_SHA=$(git rev-list -n 1 "$TAG")
            if [[ "$TAG_SHA" != "$RELEASE_SHA" ]]; then
              echo "erro: $TAG ja existe em $TAG_SHA, esperado $RELEASE_SHA" >&2
              exit 1
            fi
            echo "$TAG ja existe no commit da release; nada a fazer" >> "$GITHUB_STEP_SUMMARY"
          else
            git tag -a "$TAG" -m "Release $V"
            git push origin "$TAG"
          fi

          {
            echo "### Publicado v$V"
            echo ""
            echo '~~~'
            echo "/plugin marketplace update react-dev-marketplace"
            echo "codex plugin marketplace upgrade"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
