<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>React Dev Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen">
    <main class="max-w-7xl mx-auto p-6">
      <header class="flex flex-wrap justify-between gap-4 mb-8">
        <div>
          <p class="text-blue-400 font-semibold">PROJECT HUB</p>
          <h1 class="text-3xl font-bold">React Dev Hub</h1>
          <p class="text-slate-400">
            Projetos, design system, reviews e evolução arquitetural.
          </p>
        </div>
        <div class="flex gap-2">
          <button
            onclick="openProject()"
            class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg font-medium"
          >
            + Projeto
          </button>
          <button
            onclick="openForm('components')"
            class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-lg font-medium"
          >
            + Componente
          </button>
          <button
            onclick="openForm('reviews')"
            class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-lg font-medium"
          >
            + Review
          </button>
        </div>
      </header>
      <section
        id="metrics"
        class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-8"
      ></section>
      <nav class="flex gap-2 border-b border-slate-800 mb-6">
        <button data-tab="projects" class="tab px-3 py-2">Projetos</button
        ><button data-tab="components" class="tab px-3 py-2">Componentes</button
        ><button data-tab="reviews" class="tab px-3 py-2">Reviews</button>
      </nav>
      <section id="content"></section>
    </main>
    <dialog
      id="modal"
      class="bg-slate-900 text-slate-100 rounded-xl p-0 w-full max-w-lg backdrop:bg-black/70"
    >
      <form method="dialog" class="p-6">
        <div class="flex justify-between items-center mb-4">
          <h2 id="modalTitle" class="text-xl font-bold"></h2>
          <button class="text-slate-400">×</button>
        </div>
        <div id="fields" class="space-y-3"></div>
        <div class="flex justify-end gap-2 mt-6">
          <button class="px-3 py-2">Cancelar</button
          ><button
            type="button"
            onclick="saveForm()"
            class="bg-blue-600 px-3 py-2 rounded"
          >
            Salvar
          </button>
        </div>
      </form>
    </dialog>
    <script>
      let data = { projects: [], components: [], reviews: [], checklists: {} },
        tab = "projects",
        editing = null;
      const labels = {
        projects: "Projetos",
        components: "Componentes",
        reviews: "Code review",
      };
      const fields = {
        projects: [
          ["name", "Nome"],
          ["path", "Caminho local"],
          ["platform", "Plataforma (React / Next.js / Expo)"],
          ["status", "Status"],
          ["reactVersion", "Versão React"],
          ["stack", "Stack"],
          ["level", "Nível (Beginner / Junior / Mid-Level / Senior)"],
          ["notes", "Notas"],
        ],
        components: [
          ["name", "Nome"],
          ["project", "Projeto"],
          ["category", "Categoria"],
          ["path", "Caminho"],
          ["description", "Descrição"],
        ],
        reviews: [
          ["project", "Projeto"],
          ["maintainability", "Manutenibilidade (0-100)"],
          ["summary", "Resumo"],
          ["debts", "Débitos técnicos (separados por vírgula)"],
        ],
      };
      async function api(url, opt = {}) {
        const r = await fetch(url, opt);
        if (!r.ok) throw new Error("Não foi possível salvar");
        return r.json();
      }
      async function load() {
        data = await api("/api/data");
        render();
      }
      function metric(title, value) {
        return `<div class="bg-slate-900 border border-slate-800 rounded-xl p-4"><p class="text-slate-400 text-sm">${title}</p><p class="text-2xl font-bold">${value}</p></div>`;
      }
      function render() {
        document
          .querySelectorAll(".tab")
          .forEach(
            (b) =>
              (b.className =
                "tab px-3 py-2 " +
                (b.dataset.tab === tab
                  ? "border-b-2 border-blue-400 text-blue-300"
                  : "text-slate-400")),
          );
        document.querySelector("#metrics").innerHTML =
          metric("Projetos", data.projects.length) +
          metric("Componentes", data.components.length) +
          metric("Reviews", data.reviews.length) +
          metric(
            "Dívidas",
            data.reviews.reduce((n, r) => n + (r.debts || []).length, 0),
          );
        document.querySelector("#content").innerHTML =
          tab === "projects"
            ? projects()
            : tab === "components"
              ? table("components")
              : table("reviews");
      }
      function escape(s = "") {
        return String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }
      function projects() {
        if (!data.projects.length) return empty("Nenhum projeto registrado.");
        return `<div class="grid md:grid-cols-2 xl:grid-cols-3 gap-4">${data.projects.map((p) => `<article class="bg-slate-900 border border-slate-800 rounded-xl p-5"><div class="flex justify-between"><h2 class="font-bold text-lg">${escape(p.name)}</h2><span class="text-xs bg-blue-950 text-blue-300 rounded px-2 py-1">${escape(p.status || "Em andamento")}</span></div><p class="text-slate-400 mt-2">${escape(p.platform || "React")} · ${escape(p.reactVersion || "TypeScript")}</p><p class="text-sm mt-3">${escape(p.stack || "")}</p><p class="text-xs text-slate-500 mt-2">${escape(p.path || "")}</p><div class="mt-4 flex gap-2"><button onclick="openProject('${p.id}')" class="text-blue-300">Editar</button><button onclick="checklist('${p.id}')" class="text-emerald-300">Checklist</button><button onclick="remove('projects','${p.id}')" class="text-rose-300">Excluir</button></div></article>`).join("")}</div>`;
      }
      function table(type) {
        const list = data[type];
        if (!list.length) return empty("Nenhum registro ainda.");
        const cols = fields[type].slice(0, 4);
        return `<div class="overflow-x-auto bg-slate-900 rounded-xl border border-slate-800"><table class="w-full text-left"><thead class="text-slate-400 text-sm"><tr>${cols.map((c) => `<th class="p-3">${c[1]}</th>`).join("")}<th></th></tr></thead><tbody>${list.map((x) => `<tr class="border-t border-slate-800">${cols.map((c) => `<td class="p-3">${escape(Array.isArray(x[c[0]]) ? x[c[0]].join(", ") : x[c[0]])}</td>`).join("")}<td><button onclick="openForm('${type}','${x.id}')" class="text-blue-300">Editar</button> <button onclick="remove('${type}','${x.id}')" class="text-rose-300">Excluir</button></td></tr>`).join("")}</tbody></table></div>`;
      }
      function empty(t) {
        return `<div class="p-10 text-center border border-dashed border-slate-700 rounded-xl text-slate-400">${t}</div>`;
      }
      function openProject(id) {
        openForm("projects", id);
      }
      function openForm(type, id) {
        editing = { type, id };
        const item = id ? data[type].find((x) => x.id === id) : {};
        document.querySelector("#modalTitle").textContent =
          (id ? "Editar " : "Novo ") + labels[type];
        document.querySelector("#fields").innerHTML = fields[type]
          .map(
            ([key, label]) =>
              `<label class="block text-sm text-slate-300">${label}<input data-key="${key}" value="${escape(Array.isArray(item?.[key]) ? item[key].join(", ") : item?.[key] || "")}" class="mt-1 w-full bg-slate-800 border border-slate-700 rounded p-2 text-white"></label>`,
          )
          .join("");
        modal.showModal();
      }
      async function saveForm() {
        const item = { id: editing.id };
        document
          .querySelectorAll("[data-key]")
          .forEach((el) => (item[el.dataset.key] = el.value.trim()));
        if (editing.type === "reviews")
          item.debts = item.debts
            ? item.debts
                .split(",")
                .map((x) => x.trim())
                .filter(Boolean)
            : [];
        await api("/api/" + editing.type, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(item),
        });
        modal.close();
        load();
      }
      async function remove(type, id) {
        if (confirm("Excluir este registro?")) {
          await api("/api/" + type + "/" + id, { method: "DELETE" });
          load();
        }
      }
      async function checklist(id) {
        const p = data.projects.find((x) => x.id === id),
          items = data.checklists[id] || {};
        const base = [
          "TypeScript estrito configurado",
          "Estados de erro e loading definidos",
          "Componentes acessíveis",
          "Responsabilidades separadas",
          "Testes proporcionais ao risco",
          "Estado global justificado",
        ];
        const result = prompt(
          "Checklist de " +
            p.name +
            "\nMarque números concluídos separados por vírgula:\n" +
            base
              .map((x, i) => `${i + 1}. ${items[i] ? "✓ " : ""}${x}`)
              .join("\n"),
        );
        if (result === null) return;
        const marked = {};
        result.split(",").forEach((n) => {
          const i = Number(n.trim()) - 1;
          if (base[i]) marked[i] = true;
        });
        await api("/api/checklists", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ projectId: id, items: marked }),
        });
        load();
      }
      document.querySelectorAll(".tab").forEach(
        (b) =>
          (b.onclick = () => {
            tab = b.dataset.tab;
            render();
          }),
      );
      load().catch(
        () =>
          (document.querySelector("#content").innerHTML = empty(
            "Servidor indisponível. Execute dashboard-server.py.",
          )),
      );
    </script>
  </body>
</html>
